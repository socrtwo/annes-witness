name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate command plan and metadata
        run: python scripts/gen-plan.py --check
      - name: Validate JSON files
        run: |
          python -m json.tool AnnesWitness.meta.json
          python -m json.tool package.json
          python -m json.tool docs/commands-plan.json

  web:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Live test against the Claude API (only when the ANTHROPIC_API_KEY secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx vitest run tests/live.test.ts
      - run: npm run build
      - name: End-to-end test in Chromium (Claude API mocked)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: annes-witness-web
          path: dist
